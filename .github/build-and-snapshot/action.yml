name: Build and snapshot
description: Build in CI environment and create snapshot/releases of artifacts
inputs:
  build_script:
    description: "the ci build script to run"
    required: true
  artifact_name:
    description: "artifact name (for snapshot)"
    required: false
    default: ""
  artifact_path:
    description: "artifact path (for snapshot)"
    required: false
    default: ""
  upload_artifact:
    description: "create temp. artifact snapshots in runner"
    required: false
    default: "false"
  release_artifact:
    description: "create a release"
    required: false
    default: "false"
  release_name:
    description: "the project name of the release, e.g. linux, tf-rmm etc."
    required: false
    default: "generic"

runs:
  using: "composite"
  steps:
    - name: Clone CI scripts and run build script
      shell: bash
      run: |
        rm -rf .ci || true
        git clone --depth 1 https://github.com/opencca/ci-scripts .ci
        cd .ci
        ./run-ci.sh "$GITHUB_WORKSPACE" "./${{ inputs.build_script }}"

    - name: Upload artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_path }}
        if-no-files-found: error

    - name: Prepare snapshot and latest tags
      if: ${{ inputs.release_artifact == 'true' }}
      shell: bash
      run: |
        BRANCH_NAME="${GITHUB_REF##*/}"
        SANITIZED_BRANCH="${BRANCH_NAME//\//-}"
        TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)

        echo "RELEASE_TAG=${{ inputs.release_name }}/snapshot/${SANITIZED_BRANCH}/${TIMESTAMP}" >> $GITHUB_ENV
        echo "LATEST_TAG=${{ inputs.release_name }}/snapshot/${SANITIZED_BRANCH}/latest" >> $GITHUB_ENV

    - name: Upload snapshot release to releases repo
      if: ${{ inputs.release_artifact == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        repository: opencca/opencca-releases
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        body: ""
        fail_on_unmatched_files: true
        files: |
          ${{ inputs.artifact_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

    - name: Update 'latest' tag in releases repo
      if: ${{ inputs.release_artifact == 'true' }}
      shell: bash
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        git clone --bare https://x-access-token:${{ secrets.RELEASES_REPO_TOKEN }}@github.com/opencca/opencca-releases.git releases-bare
        cd releases-bare

        git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --depth=1
        git tag -f "${LATEST_TAG}" "${RELEASE_TAG}"
        git push origin ":refs/tags/${LATEST_TAG}" || true
        git push origin "refs/tags/${LATEST_TAG}"
